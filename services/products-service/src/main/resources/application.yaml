app:
  time-zone: Europe/Moscow
spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  application:
    name: warehouse_inventory_management
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: false # Запуск через докер, в котором отдельный контейнер для LB

# Python-сервис, который рисует PDF по SummaryReportDto.
# В docker он доступен по имени сервиса, локально — по localhost.
report:
  pdf-service:
    url: ${REPORT_PDF_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 30s

# Телеграм-бот: пишет в чат, когда товар заканчивается, и записывает поступления.
# Без telegram.token бот молча не стартует — остальное приложение работает как обычно.
telegram:
  enabled: ${TELEGRAM_ENABLED:true}
  token: ${TELEGRAM_BOT_TOKEN:}
  # Чат для уведомлений. У группы id отрицательный, узнать можно командой /chatid
  chat-id: ${TELEGRAM_CHAT_ID:}
  # Кого тегать в уведомлении, например @dasha. Пинг сработает, только если у человека есть @username
  mention: ${TELEGRAM_MENTION:}
  poll-timeout: ${TELEGRAM_POLL_TIMEOUT:25s}
  # Если с сервера api.telegram.org недоступен — сюда ставится адрес своего
  # реверс-прокси, см. deploy/telegram-proxy-worker.js
  api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
