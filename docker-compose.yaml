services:
  backend:
    env_file:
      - .env
    build:
      context: .
      args:
        # Секретный префикс пути, задаётся в .env: APP_BASE_PATH=/k3j9x2abc
        BASE_PATH: ${APP_BASE_PATH:-}
    image: inventory_backend
    restart: unless-stopped
    environment:
      # Наружу python-сервис не публикуется — только внутри сети compose
      REPORT_PDF_URL: http://report-service:8000
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    ports:
      # Только localhost: снаружи ходят через nginx с HTTPS
      - "127.0.0.1:8080:8080"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      report-service:
        condition: service_healthy
    networks:
      - backend_net

  report-service:
    build:
      context: ./report-service
    image: inventory_report_pdf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - backend_net
  db:
    image: postgres:latest
    container_name: Storage_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Docker обходит ufw, поэтому без 127.0.0.1 база торчит в интернет
      - "127.0.0.1:5430:5432"
    volumes:
      - dbv:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - backend_net

  liquibase:
    image: liquibase:4.30.0
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src/main/resources/db/changelog:/liquibase/changelog:ro
    working_dir: /liquibase/changelog
    command:
      - --changeLogFile=db.changelog-master.yaml
      - --url=${DB_URL}
      - --username=${DB_USER}
      - --password=${DB_PASS}
      - update
    networks:
      - backend_net


networks:
  backend_net:
    driver: bridge

volumes:
  dbv: